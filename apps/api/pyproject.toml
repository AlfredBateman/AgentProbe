[project]
name = "agentprobe-api"
version = "0.0.0"
description = "AgentProbe FastAPI backend and workers."
requires-python = ">=3.12"
dependencies = [
    "agentprobe-core",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.6",
    "uvicorn==0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"
