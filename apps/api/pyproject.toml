[project]
name = "agentprobe-api"
version = "0.0.0"
description = "AgentProbe FastAPI backend and workers."
requires-python = ">=3.12"
dependencies = [
    "agentprobe-core==0.0.0",
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.1",
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.0",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.0.54",
    "taskiq==0.12.6",
    "taskiq-redis==1.2.3",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
# Live LLM judging on the server (docs/DEPLOY.md): opt-in, since LiteLLM's tree is large. The
# API image installs it only when built with --build-arg API_EXTRAS=live.
live = ["agentprobe-core[live]==0.0.0"]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"
