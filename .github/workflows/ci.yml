name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same Postgres major and pgvector version as the Neon branches (ADR 0008).
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentprobe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # DATABASE_URL names a different database so the conftest guard lets DB tests run.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentprobe
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentprobe_test
      ALLOW_DB_TESTS: "1"
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag upstream
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not live and not redis" --cov=agentprobe_core --cov=agentprobe_api --cov-report=
      # Separate and verbose, so the log shows every redis test ran (PASSED), none skipped.
      - run: uv run pytest -m redis -v -rA --cov=agentprobe_core --cov=agentprobe_api --cov-append --cov-report=
      - run: uv run coverage html --include="*/agentprobe_core/*,*/agentprobe_api/*" && uv run coverage xml --include="*/agentprobe_core/*,*/agentprobe_api/*"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 14
      # B1.9: at least 80% per package, unit + integration + redis combined.
      - run: uv run coverage report --include="*/agentprobe_core/*" --skip-covered --fail-under=80
      - run: uv run coverage report --include="*/agentprobe_api/*" --skip-covered --fail-under=80

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      # Generated files (theme from DESIGN.md, API types from openapi.json) must be committed current.
      - run: pnpm --filter web gen:theme && pnpm --filter web gen:api && git diff --exit-code
      - run: pnpm --filter web build
      # /dev/components is a *.dev.tsx page: it must never reach a production build.
      - run: test ! -e apps/web/.next/server/app/dev

  e2e:
    # The main user flow, end to end: its own Postgres service container (never Neon, and
    # never the other jobs' database), migrated and reset before the run (playwright.config.ts's
    # globalSetup), with the API (QUEUE_BACKEND=inline, LLM_PROVIDER=mock) and the demo agents
    # (mock mode, seeded flakiness) started as Playwright webServers alongside a production
    # `next build`.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentprobe_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentprobe_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --locked
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright's Chromium (and OS deps only on a cache miss)
        run: pnpm --filter web exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm --filter web exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: pnpm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  packaging:
    # The CLI as an end user installs it (PyPI wheels), not the uv workspace's editable
    # install: builds agentprobe-core and agentprobe, then checks they install and run in a
    # venv this repo's own workspace never touches.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/verify_wheel.py

  audit:
    # Known vulnerabilities in every locked dependency, dev tools and the `live` extra included.
    # A finding fails CI until it is fixed, pinned or accepted in an ADR (ADR 0034).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the secret scan reads every commit, not just this one
      # The repo is public: no commit on any ref may carry a secret. Known public dev values
      # are listed by fingerprint in .gitleaksignore.
      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --log-opts=--all --redact --no-banner .
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv export --locked --all-extras --all-groups --no-emit-workspace --format requirements-txt -o requirements-audit.txt
      # --disable-pip: audit the hashed, fully pinned export as-is instead of re-resolving it.
      - run: uvx pip-audit==2.10.1 -r requirements-audit.txt --disable-pip --progress-spinner off
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm audit

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The image bundles shellcheck, so run: scripts are checked too.
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  docker:
    # README "Run the whole stack with Docker", command for command: build the images, start
    # the stack (it's up only once every healthcheck passes), smoke-test it, tear it down.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: python3 scripts/compose_smoke.py
      - run: docker image ls --filter reference='agentprobe-*'  # final image sizes, for the log
      - name: Dump compose state and logs
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --timestamps
      - if: always()
        run: docker compose down -v
      # Not part of the quick start: the opt-in live-judging API image (docs/DEPLOY.md) builds
      # and can import LiteLLM, so enabling it in production isn't the first time it's built.
      - run: docker build -f apps/api/Dockerfile --build-arg API_EXTRAS=live -t agentprobe-api:live .
      - run: docker run --rm agentprobe-api:live python -c "import litellm, agentprobe_core.llm.live"
