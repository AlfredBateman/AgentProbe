name: Deploy

# Production deploy (ADR 0036, docs/DEPLOY.md): runs only after CI passes on a push to main,
# on exactly the commit CI tested. Order: migrate the Neon production database, trigger the
# Render deploy hooks of the demo agents and the API for that commit, wait until the API
# reports that commit, then deploy the web app to Vercel.
#
# Disarmed until the repository variable DEPLOY_ENABLED is "true" (the last step of the manual
# checklist in docs/DEPLOY.md), so pushes before the services exist don't fail here.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a deploy halfway

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --locked
      # Before the new code ships, so it never runs against an old schema. Migrations must stay
      # compatible with the code still running until the API deploy below finishes.
      - name: Migrate the production database
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: uv run alembic -c apps/api/alembic.ini upgrade head

      # Render builds each image from the repository itself (Docker runtime, auto-deploy off).
      # A hook URL is a credential (its `key` parameter), so it's never echoed; `ref` pins the
      # build to the commit CI tested rather than whatever main is by then.
      - name: Trigger the Render deploys
        env:
          DEMO_HOOK: ${{ secrets.RENDER_DEMO_DEPLOY_HOOK }}
          API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error --output /dev/null -X POST "$DEMO_HOOK&ref=$SHA"
          curl --fail --silent --show-error --output /dev/null -X POST "$API_HOOK&ref=$SHA"

      # /ready reports RENDER_GIT_COMMIT, so this waits for the new build to be live and its
      # database to answer, not just for the old instance to keep answering. A free build takes
      # minutes; each probe also keeps the instance awake.
      - name: Wait for the API to serve this commit
        run: |
          deadline=$((SECONDS + 1800))
          until [ "$(curl --silent --max-time 90 "$API_URL/ready" | jq -r '.commit // empty' 2>/dev/null)" = "$SHA" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$API_URL/ready did not report $SHA within 30 minutes (check the Render deploy log)"
              exit 1
            fi
            sleep 20
          done

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Deploy the web app to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@61.0.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@61.0.0 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@61.0.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Check the web app reaches the API through /api
        run: curl --fail --silent --show-error --retry 5 --retry-delay 6 --retry-all-errors "${{ vars.WEB_ORIGIN }}/api/health"
