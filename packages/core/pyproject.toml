[project]
name = "agentprobe-core"
version = "0.0.0"
description = "AgentProbe engine: suite schema, adapters, judges, attacks, statistics, LLM layer."
requires-python = ">=3.12"
dependencies = [
    "anyio==4.15.1",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pyyaml==6.0.2",
    "tzdata==2026.4; sys_platform == 'win32'",  # zoneinfo has no system tz database on Windows
]

[project.optional-dependencies]
# Live LLM calls (Gemini via LiteLLM). Opt-in: large dependency tree, imported lazily.
live = ["litellm==1.102.1"]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"
