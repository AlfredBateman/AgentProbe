[project]
name = "agentprobe"
version = "0.0.0"
description = "AgentProbe CLI: run agent test suites locally and in CI."
requires-python = ">=3.12"
dependencies = [
    "agentprobe-core",
    "rich==15.0.0",
    "typer==0.27.2",
]

[project.scripts]
agentprobe = "agentprobe.main:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"
