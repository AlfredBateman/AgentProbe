name: AgentProbe
description: >-
  Runs an AgentProbe suite against an agent, optionally pushes the result to an AgentProbe
  server for a branch-baseline comparison (or compares locally against a saved run), posts or
  updates a single PR comment with the verdict, and fails the check on a regression or a pass
  rate below threshold.
author: AgentProbe
branding:
  icon: check-circle
  color: purple

inputs:
  suite:
    description: Path to the suite YAML file.
    required: true
  agent:
    description: "Agent name from the config file. Default: the suite's own `agent:` field."
    required: false
    default: ""
  config:
    description: Path to agentprobe.yaml.
    required: false
    default: agentprobe.yaml
  fail-under:
    description: Minimum pass rate (point estimate).
    required: false
    default: "1.0"
  mock:
    description: Force the mock LLM provider for judges (no live model calls).
    required: false
    default: "true"
  baseline-branch:
    description: >-
      With a server configured (api-url/api-key): compare on the server against this
      branch's baseline. Default: the resolved `branch`.
    required: false
    default: ""
  baseline-run:
    description: >-
      Path to a local run JSON file to compare against when no server is configured (e.g. a
      workflow-artifact baseline downloaded by the caller). Ignored when api-url/api-key are
      set, since the server-side comparison takes over.
    required: false
    default: ""
  branch:
    description: "This run's branch. Default: the PR head ref, or the current ref."
    required: false
    default: ""
  git-sha:
    description: "The commit being tested. Default: github.sha."
    required: false
    default: ""
  pr-number:
    description: "The PR number, if any. Default: taken from the triggering event."
    required: false
    default: ""
  api-url:
    description: AgentProbe server URL. Omit to run without a server (mock/local mode).
    required: false
    default: ""
  api-key:
    description: >-
      AgentProbe project API key. Never available on a fork PR run, since fork PRs get no
      access to repository secrets; the action degrades to local/mock mode when this is empty.
    required: false
    default: ""
  cli-package:
    description: >-
      pip install spec for the `agentprobe` CLI. Empty (the default) installs the CLI and its
      engine from this action's own source, at the ref the workflow pinned. Never set it to the
      bare name `agentprobe`: that PyPI name belongs to an unrelated project. Override with a
      local wheel path (or a space-separated list of wheel paths) to test an unreleased change.
    required: false
    default: ""
  python-version:
    description: Python version to run the CLI under.
    required: false
    default: "3.12"
  github-token:
    description: Token used to create/update the PR comment. Read-only on a fork PR.
    required: false
    default: ${{ github.token }}
  comment:
    description: Post or update a PR comment with the result.
    required: false
    default: "true"

outputs:
  pass-rate:
    description: The run's pass rate (point estimate), 0-1.
    value: ${{ steps.format-comment.outputs.pass-rate }}
  verdict:
    description: regression | improvement | no_change | no_baseline.
    value: ${{ steps.format-comment.outputs.verdict }}
  run-url:
    description: The dashboard URL for this run, if a server was configured; else empty.
    value: ${{ steps.format-comment.outputs.run-url }}
  exit-code:
    description: The agentprobe CLI's own exit code (see the CLI's --help for the table).
    value: ${{ steps.run-suite.outputs.exit-code }}
  result-file:
    description: >-
      Path to the raw `agentprobe run --json` result file, for a caller that wants to archive
      it (e.g. as this repo's own dogfood workflow does, as next PR's local baseline).
    value: ${{ steps.run-suite.outputs.result-file }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install the agentprobe CLI
      shell: bash
      env:
        CLI_PACKAGE: ${{ inputs.cli-package }}
      run: |
        if [ -z "$CLI_PACKAGE" ]; then
          CLI_PACKAGE="$GITHUB_ACTION_PATH/../packages/core $GITHUB_ACTION_PATH/../packages/cli"
        fi
        # Word splitting is intended: the spec may list several wheels.
        # shellcheck disable=SC2086
        pip install --disable-pip-version-check $CLI_PACKAGE

    - id: context
      name: Resolve branch, commit and PR number
      shell: bash
      run: |
        branch="${{ inputs.branch }}"
        if [ -z "$branch" ]; then branch="${{ github.head_ref || github.ref_name }}"; fi
        echo "branch=$branch" >> "$GITHUB_OUTPUT"

        sha="${{ inputs.git-sha }}"
        if [ -z "$sha" ]; then sha="${{ github.sha }}"; fi
        echo "git-sha=$sha" >> "$GITHUB_OUTPUT"

        pr="${{ inputs.pr-number }}"
        if [ -z "$pr" ]; then pr="${{ github.event.pull_request.number }}"; fi
        echo "pr-number=$pr" >> "$GITHUB_OUTPUT"

        baseline_branch="${{ inputs.baseline-branch }}"
        if [ -z "$baseline_branch" ]; then baseline_branch="$branch"; fi
        echo "baseline-branch=$baseline_branch" >> "$GITHUB_OUTPUT"

    - id: run-suite
      name: Run the suite
      shell: bash
      run: |
        args=(run "${{ inputs.suite }}" --config "${{ inputs.config }}" \
          --fail-under "${{ inputs.fail-under }}" --json)
        if [ -n "${{ inputs.agent }}" ]; then args+=(--agent "${{ inputs.agent }}"); fi
        if [ "${{ inputs.mock }}" = "true" ]; then args+=(--mock); fi

        pushed=false
        if [ -n "${{ inputs.api-key }}" ] && [ -n "${{ inputs.api-url }}" ]; then
          export AGENTPROBE_API_URL="${{ inputs.api-url }}"
          export AGENTPROBE_API_KEY="${{ inputs.api-key }}"
          args+=(--push --branch "${{ steps.context.outputs.branch }}" \
            --baseline-branch "${{ steps.context.outputs.baseline-branch }}" \
            --git-sha "${{ steps.context.outputs.git-sha }}")
          if [ -n "${{ steps.context.outputs.pr-number }}" ]; then
            args+=(--pr "${{ steps.context.outputs.pr-number }}")
          fi
          pushed=true
        elif [ -n "${{ inputs.baseline-run }}" ]; then
          args+=(--baseline "${{ inputs.baseline-run }}")
        fi
        echo "pushed=$pushed" >> "$GITHUB_OUTPUT"

        result_file="$RUNNER_TEMP/agentprobe-result.json"
        set +e
        agentprobe "${args[@]}" > "$result_file"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "result-file=$result_file" >> "$GITHUB_OUTPUT"
        if [ "${{ inputs.api-key }}" = "" ] || [ "${{ inputs.api-url }}" = "" ]; then
          echo "::notice::no api-url/api-key configured (expected on a fork PR, or before a server is deployed): ran without pushing to a server."
        fi

    - id: format-comment
      name: Format the PR comment
      shell: bash
      run: |
        python "${{ github.action_path }}/format_comment.py" \
          --result "${{ steps.run-suite.outputs.result-file }}" \
          --suite "${{ inputs.suite }}" \
          --agent "${{ inputs.agent }}" \
          --baseline-branch "${{ steps.context.outputs.baseline-branch }}" \
          --comment-out "$RUNNER_TEMP/agentprobe-comment.md" \
          --github-output "$GITHUB_OUTPUT"

    - name: Post or update the PR comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      continue-on-error: true
      run: |
        python "${{ github.action_path }}/post_comment.py" \
          --comment-file "$RUNNER_TEMP/agentprobe-comment.md" \
          --pr-number "${{ steps.context.outputs.pr-number }}" \
          --token "${{ inputs.github-token }}"

    - name: Fail the check on regression or below-threshold (agentprobe's own exit code)
      shell: bash
      run: exit ${{ steps.run-suite.outputs.exit-code }}
