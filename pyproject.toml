[project]
name = "agentprobe-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["agentprobe-core[live]", "agentprobe", "agentprobe-api", "agentprobe-demo-agents"]

[dependency-groups]
dev = [
    "cryptography==50.0.1",  # test-only here: self-signed certs for the adapter's TLS tests
    "httpx==0.28.1",
    "hypothesis==6.168.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
    "types-PyYAML==6.0.12.20250915",
    "types-jsonschema==4.26.0.20260518",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/cli", "apps/api", "demo-agents"]

[tool.uv.sources]
agentprobe-core = { workspace = true }
agentprobe = { workspace = true }
agentprobe-api = { workspace = true }
agentprobe-demo-agents = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["adapterfakes", "agentprobe", "agentprobe_api", "agentprobe_core", "agentprobe_demo_agents", "apitest", "idor", "judgefakes"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311"]  # asserts; fake credentials; seeded jitter
"demo-agents/src/**" = ["S105", "S106", "S311"]  # fake canaries/API key; seeded flakiness rng

[tool.mypy]
python_version = "3.12"
files = ["packages/core/src", "packages/cli/src", "apps/api/src", "demo-agents/src"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["agentprobe_core", "agentprobe_core.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["packages", "apps/api", "demo-agents"]
pythonpath = ["apps/api/tests", "packages/core/tests/adapters", "packages/core/tests/judges"]  # helpers: apitest, idor, adapterfakes, judgefakes
addopts = "--import-mode=importlib -m 'not integration and not redis and not live'"
asyncio_mode = "auto"
# One loop per session so the integration engine (and its warm Neon connection) is shared.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs the Neon test database (TEST_DATABASE_URL, ALLOW_DB_TESTS=1)",
    "redis: needs Redis; runs only in CI",
    "live: calls a live LLM provider; needs RUN_LIVE=1",
]
