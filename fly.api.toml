# The API on Fly.io (ADR 0035): one scale-to-zero machine, the inline queue, no Redis.
# Deployed only by .github/workflows/deploy.yml: it builds the image from apps/api/Dockerfile,
# runs the migrations first, and passes the per-deploy values (the app name, WEB_ORIGIN, the
# demo agents' host) with --app and --env. Secrets are set once with `fly secrets set`.
# Every variable is listed in docs/DEPLOY.md.

app = "agentprobe-api"
primary_region = "sin" # next to the Neon production branch (aws ap-southeast-1)
kill_signal = "SIGTERM"
kill_timeout = "30s"

[processes]
  # Not the image's default command (migrate, then serve): deploy.yml migrates, so a cold start
  # doesn't. --no-proxy-headers: the client IP comes from Fly-Client-IP, trusted only from
  # Fly's proxy (CLIENT_IP_HEADER, FORWARDED_ALLOW_IPS); X-Forwarded-For is appended to, so its
  # left entries are whatever the client sent.
  app = "uvicorn agentprobe_api.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers"

[env]
  QUEUE_BACKEND = "inline"
  RATE_LIMIT_BACKEND = "memory"
  INLINE_MAX_RUNS = "2"
  CLIENT_IP_HEADER = "Fly-Client-IP"
  FORWARDED_ALLOW_IPS = "172.16.0.0/12" # Fly's proxy reaches the machine from this range
  COOKIE_SECURE = "1"
  LOG_LEVEL = "INFO"
  # Public-abuse limits.
  SIGNUP_OPEN = "1"
  AUTH_RATE_LIMIT_PER_MINUTE = "10"
  REGISTER_RATE_LIMIT_PER_HOUR = "5"
  MAX_SIGNUPS_PER_DAY = "200"
  MAX_PROJECTS_PER_USER = "3"
  MAX_AGENTS_PER_USER = "5"
  MAX_CASES_PER_SUITE = "50"
  MAX_RUNS_PER_USER_PER_DAY = "30"
  # Mock judges by default. Live Gemini is an opt-in (docs/DEPLOY.md); these bound it if enabled.
  LLM_PROVIDER = "mock"
  RUN_LIVE = "0"
  LLM_BUDGET_USD_PER_RUN = "0.10"
  LLM_GLOBAL_USD_PER_DAY = "1.00"
  # Private targets: only the demo agents' host, via PRIVATE_TARGET_ALLOWLIST from deploy.yml.
  ALLOW_PRIVATE_TARGETS = "0"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]
