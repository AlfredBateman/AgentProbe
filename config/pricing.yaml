# USD per 1M tokens (standard paid tier, text, prompts <= 200k tokens), keyed by the LiteLLM
# model string. Source: https://ai.google.dev/gemini-api/docs/pricing, checked 2026-09-24.
#
# The free tier bills $0, so on it these are estimates of what the same usage would cost on the
# paid tier; the USD budget guard (LLM_BUDGET_USD_PER_RUN / _PER_DAY) enforces against them.
# Every model in config/llm.yaml (or LLM_MODEL_*) needs an entry, or a live client won't start.
gemini/gemini-3.1-flash-lite: {input: 0.25, output: 1.50}
gemini/gemini-3.5-flash-lite: {input: 0.30, output: 2.50}
gemini/gemini-3.5-flash: {input: 1.50, output: 9.00}
gemini/gemini-3.8-flash: {input: 0.75, output: 3.75}  # promotional until 2026-12-31, then doubles
gemini/gemini-2.5-flash: {input: 0.30, output: 2.50}
gemini/gemini-2.5-flash-lite: {input: 0.10, output: 0.40}
gemini/gemini-embedding-2: {input: 0.20}
